<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ROGUE OF ARCADIA — ローグ・オブ・アルカディア</title>
<style>
:root{
  --bg:#100c14; --panel:#1b1522; --panel-line:#332b3d;
  --ember:#e0793c; --ember-dim:#8a4a26;
  --text:#e8dfe6; --text-dim:#8f8398;
  --hp:#c94f4f; --xp:#4fa5c9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Courier New',ui-monospace,monospace;
  display:flex; flex-direction:column; align-items:center;
  padding:8px 10px 10px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
h1{
  font-size:12.5px; letter-spacing:0.12em; color:var(--ember);
  margin:0 0 6px; font-weight:600; text-shadow:0 0 8px rgba(224,121,60,0.35);
  text-align:center; flex-shrink:0;
}
.wrap{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; max-width:720px; flex:1; min-height:0; justify-content:center;}
.hud{display:flex; justify-content:space-between; width:100%; font-size:11px; color:var(--text-dim); padding:0 2px; flex-shrink:0;}
.hud b{color:var(--text);}
#canvasBox{
  aspect-ratio:640/384; background:#000; flex-shrink:0;
  border:3px solid var(--panel-line); border-radius:2px;
  box-shadow:0 0 0 1px #000, 0 8px 24px rgba(0,0,0,0.5);
  position:relative; overflow:hidden; touch-action:none;
}
canvas{width:100%; height:100%; image-rendering:pixelated; display:block;}
#joyZone{position:absolute; width:88px; height:88px; touch-action:none; z-index:5; display:none;}
#joyBase{position:absolute; inset:0; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);}
#joyThumb{position:absolute; width:38px; height:38px; left:25px; top:25px; border-radius:50%; background:rgba(224,121,60,0.55); border:1px solid rgba(224,121,60,0.85); pointer-events:none;}
#atkJoyZone{position:absolute; width:88px; height:88px; touch-action:none; z-index:5; display:none;}
#atkJoyBase{position:absolute; inset:0; border-radius:50%; background:rgba(255,226,122,0.09); border:1px solid rgba(255,226,122,0.3);}
#atkJoyThumb{position:absolute; width:38px; height:38px; left:25px; top:25px; border-radius:50%; background:rgba(255,226,122,0.55); border:1px solid rgba(255,226,122,0.9); pointer-events:none;}
.bars{display:flex; flex-direction:column; gap:3px; width:100%; flex-shrink:0;}
.barrow{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--text-dim);}
.barrow span.lbl{width:26px;}
.bartrack{flex:1; height:8px; background:var(--panel); border:1px solid var(--panel-line); border-radius:2px; overflow:hidden;}
.barfill{height:100%; transition:width 0.2s;}
.hpfill{background:var(--hp);} .xpfill{background:var(--xp);}
.itembar{display:flex; gap:6px; width:100%; flex-shrink:0; justify-content:center;}
.itemslot{
  width:32px; height:32px; background:var(--panel); border:1px solid var(--panel-line);
  border-radius:5px; position:relative; display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.itemslot.empty{opacity:0.3;}
.itemslot.usable{cursor:pointer;}
.itemslot .count{position:absolute; bottom:0px; right:2px; font-size:8.5px; color:var(--text); text-shadow:0 0 2px #000;}
#log{
  width:100%; height:38px; background:var(--panel); border:1px solid var(--panel-line);
  border-radius:2px; font-size:10.5px; color:var(--text-dim); padding:5px 8px;
  overflow-y:auto; line-height:1.4; flex-shrink:0;
}
#log div:last-child{color:var(--ember);}
#overlay{
  position:fixed; inset:0; background:rgba(8,5,10,0.92); display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:10;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#overlay h2{color:var(--ember); font-size:20px; letter-spacing:0.08em;}
#overlay p{color:var(--text-dim); font-size:13px; text-align:center; max-width:280px;}
#overlay button{
  background:var(--ember-dim); color:#fff; border:1px solid var(--ember);
  padding:10px 22px; font-size:13px; border-radius:3px; cursor:pointer; font-family:inherit;
}
#overlay button:hover{background:var(--ember);}
.hint{font-size:9.5px; color:var(--text-dim); margin-top:0; text-align:center; flex-shrink:0;}
</style>
</head>
<body>
<h1>ROGUE OF ARCADIA 一 ローグ・オブ・アルカディア</h1>
<div class="wrap">
  <div class="hud">
    <span>地下 <b id="floorNum">1</b>階</span>
    <span>Lv.<b id="lvNum">1</b></span>
    <span>最高到達: <b id="bestFloor">1</b>F</span>
  </div>
  <div id="canvasBox">
    <canvas id="cv" width="640" height="384"></canvas>
    <div id="joyZone"><div id="joyBase"></div><div id="joyThumb"></div></div>
    <div id="atkJoyZone"><div id="atkJoyBase"></div><div id="atkJoyThumb"></div></div>
  </div>
  <div class="bars">
    <div class="barrow"><span class="lbl">HP</span><div class="bartrack"><div class="barfill hpfill" id="hpBar" style="width:100%"></div></div><span id="hpText">10/10</span></div>
    <div class="barrow"><span class="lbl">EXP</span><div class="bartrack"><div class="barfill xpfill" id="xpBar" style="width:0%"></div></div><span id="xpText">0/10</span></div>
  </div>
  <div id="log"></div>
  <div class="itembar" id="itembar"></div>
  <div class="hint">左側スティックで移動 / 右側スティックで攻撃(向いた方向に斬る)</div>
</div>

<div id="overlay">
  <h2 id="overTitle">力尽きた…</h2>
  <p id="overText"></p>
  <button id="overBtn">最初からやり直す</button>
</div>

<script src="game.js"></script>
</body>
</html>
